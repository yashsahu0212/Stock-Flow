version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: stockflow_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: stockflow_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  app:
    build: .
    container_name: stockflow_app
    restart: always
    depends_on:
      - postgres
    environment:
      PORT: 5000
      NODE_ENV: production
      DATABASE_URL: postgresql://postgres:password123@postgres:5432/stockflow_db?schema=public
      JWT_SECRET: stockflow_super_secure_production_secret_key_2026
    ports:
      - "5000:5000"

volumes:
  postgres_data:
